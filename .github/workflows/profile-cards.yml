name: Profile cards

# Renders the animated SVG cards from live GitHub data and publishes them to the
# `output` branch of the profile repo, where README.md loads them from.
on:
  # Every run queues the next one 30 minutes on (the `next` job below). GitHub's cron drops most
  # scheduled runs here, so it is only the backup that restarts the chain if it ever breaks
  # (hh:01 and hh:31 IST; cron is UTC, IST = UTC+5:30). Actions minutes are free in a public repo.
  schedule:
    - cron: "1,31 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PROFILE_REPO: alishaaverma/alishaaverma

jobs:
  render:
    runs-on: ubuntu-latest
    concurrency:
      group: profile-cards
      cancel-in-progress: false # a dispatch that arrives mid-render waits instead of killing it
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check out profile repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROFILE_REPO }}
          token: ${{ secrets.PROFILE_REPO_TOKEN }}
          path: profile

      - name: Render cards
        env:
          GITHUB_USERNAME: alishaaverma
          GITHUB_TOKEN: ${{ github.token }} # read-only, public data
        run: python generate.py --out dist --readme profile/README.md --count-views

      - name: Publish cards to the output branch
        working-directory: dist
        env:
          TOKEN: ${{ secrets.PROFILE_REPO_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update profile cards"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${PROFILE_REPO}.git" output

      - name: Commit README links (projects, contact buttons) if they changed
        working-directory: profile
        run: |
          if git diff --quiet README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "Update profile links"
          git push -q

  # Queue the next render 30 minutes from now, even if this one failed.
  next:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    # Settings → Environments → refresh-wait → Wait timer: 30 minutes. A job waiting on the timer
    # holds no runner; without the timer the sleep below does the waiting instead.
    environment: refresh-wait
    permissions:
      actions: write
    steps:
      - name: Dispatch the next render unless a newer run will
        env:
          GH_TOKEN: ${{ github.token }} # a workflow_dispatch from GITHUB_TOKEN does start a run
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          wait=$(( $(date -d "$started" +%s) + 29 * 60 - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          newer=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/profile-cards.yml/runs?per_page=20" \
                  --jq "[.workflow_runs[] | select(.id > $GITHUB_RUN_ID and .status != \"completed\")] | length")
          if [ "$newer" != "0" ]; then
            echo "A newer run is queued or running; it will dispatch the next render"; exit 0
          fi
          gh workflow run profile-cards.yml -R "$GITHUB_REPOSITORY" --ref main
